# Nginx reverse proxy for the civ app.
#
# This mirrors /etc/nginx/sites-available/civ as it actually runs, including the
# TLS block certbot wrote. Edit here and copy to the server, not the other way
# round, so the two do not drift apart again.
#
# Install: sudo cp config/deploy/nginx.conf /etc/nginx/sites-available/civ
#          sudo ln -s /etc/nginx/sites-available/civ /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# On a host that has no certificate yet, nginx refuses to start with the TLS
# block. Drop the `ssl_*`/`include` lines and the redirect server, reload with
# `listen 80` in the first server, then run
# `sudo certbot --nginx -d civ5stats.duckdns.org` to have certbot write them back.
upstream civ_puma {
    server unix:/run/civ/puma.sock;
}

server {
    server_name civ5stats.duckdns.org;

    root /home/deploy/civ/public;

    # Serve precompiled assets straight from disk.
    location ~ ^/assets/ {
        expires 1y;
        add_header Cache-Control public;
        try_files $uri =404;
    }

    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://civ_puma;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/civ5stats.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/civ5stats.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = civ5stats.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name civ5stats.duckdns.org;
    return 404; # managed by Certbot
}
